<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pinkxraliz Site - Post an Ad</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { padding-top: 2rem; }
    .ad { border:1px solid #e9ecef; padding:1rem; border-radius:6px; }
    .featured { border-color: #ff8fb3; background: linear-gradient(90deg,#fff7fb,#fff); }
    #chat { max-height: 300px; overflow:auto; }
  </style>
</head>
<body class="container">
  <h1 class="mb-3">Pinkxraliz Site</h1>
  <p class="lead">Post your ad for <strong>500 NGN / week</strong>. Feature your ad for an extra <strong>200 NGN</strong>.</p>

  <div class="row">
    <div class="col-md-6">
      <div class="card mb-3">
        <div class="card-body">
          <h5 class="card-title">Create an Ad</h5>
          <form id="adForm">
            <div class="mb-2">
              <label class="form-label">Title</label>
              <input name="title" class="form-control" required>
            </div>
            <div class="mb-2">
              <label class="form-label">Description</label>
              <textarea name="description" class="form-control" rows="4" required></textarea>
            </div>
            <div class="mb-2">
              <label class="form-label">Your name</label>
              <input name="owner_name" class="form-control">
            </div>
            <div class="mb-2">
              <label class="form-label">Your email</label>
              <input name="owner_email" type="email" class="form-control" required>
            </div>
            <div class="form-check mb-2">
              <input class="form-check-input" type="checkbox" name="featured" id="featured">
              <label class="form-check-label" for="featured">Feature this ad (+200 NGN)</label>
            </div>
            <button type="submit" class="btn btn-primary">Create & Pay</button>
            <div id="msg" class="mt-2"></div>
          </form>
        </div>
      </div>

      <div class="card">
        <div class="card-body">
          <h5 class="card-title">AI Helper</h5>
          <p class="small">Get help writing your title and description. No API key required for basic help; connect an OpenAI key in .env for advanced suggestions.</p>
          <div id="chat" class="mb-2 border rounded p-2" aria-live="polite"></div>
          <div class="input-group">
            <input id="aiInput" class="form-control" placeholder="Describe your item or what you want to advertise">
            <button id="aiBtn" class="btn btn-outline-secondary">Ask AI</button>
          </div>
        </div>
      </div>
    </div>

    <div class="col-md-6">
      <h4>Active Ads</h4>
      <div id="adsList"></div>
    </div>
  </div>

<script>
async function loadAds() {
  const res = await fetch('/ads');
  const data = await res.json();
  const container = document.getElementById('adsList');
  container.innerHTML = '';
  if (!data || data.length === 0) {
    container.innerHTML = '<p>No active ads yet.</p>';
    return;
  }
  data.forEach(a => {
    const div = document.createElement('div');
    div.className = 'ad mb-2' + (a.featured ? ' featured' : '');
    div.innerHTML = `
      <h5>${escapeHtml(a.title)} ${a.featured ? '<span class="badge bg-pink text-light">FEATURED</span>' : ''}</h5>
      <p>${escapeHtml(a.description)}</p>
      <small>Posted: ${a.created_at} • Expires: ${a.expires_at || 'N/A'}</small>
    `;
    container.appendChild(div);
  });
}

function escapeHtml(s){ return s ? s.replace(/&/g,'&amp;').replace(/</g,'&lt;') : ''; }

document.getElementById('adForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const data = Object.fromEntries(new FormData(e.target).entries());
  document.getElementById('msg').textContent = 'Creating ad...';
  const res = await fetch('/ads', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify(data)
  });
  const json = await res.json();
  if (!json.success) {
    document.getElementById('msg').textContent = 'Error: ' + (json.error || 'unknown');
    return;
  }
  // Redirect to pay endpoint (server redirects to Paystack)
  window.location = `/ads/${json.id}/pay`;
});

// AI helper
const chatDiv = document.getElementById('chat');
function addChat(text, who='bot'){
  const p = document.createElement('div');
  p.className = who === 'bot' ? 'mb-2 text-muted' : 'mb-2';
  p.innerHTML = who === 'bot' ? `<strong>AI:</strong> ${escapeHtml(text).replace(/\n/g,'<br>')}` : `<strong>You:</strong> ${escapeHtml(text)}`;
  chatDiv.prepend(p);
}

document.getElementById('aiBtn').addEventListener('click', async () => {
  const input = document.getElementById('aiInput');
  const text = input.value.trim();
  if (!text) return;
  addChat(text, 'user');
  addChat('Thinking...', 'bot');
  try {
    const res = await fetch('/ai', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ message: text }) });
    const j = await res.json();
    chatDiv.firstChild.innerHTML = `<strong>AI:</strong> ${escapeHtml(j.reply || j.error || 'No reply').replace(/\n/g,'<br>')}`;
  } catch (err) {
    chatDiv.firstChild.innerHTML = `<strong>AI:</strong> Error contacting AI`;
  }
  input.value = '';
});

loadAds();
</script>
</body>
</html>
